[package]
name = "calabi-yau-ai-platform"
version = "0.2.0"
description = "Calabi-Yau AI Platform: Higher-dimensional geometric visualization for local Ollama LLM inference"
authors = ["Principal Architecture Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["window-close", "window-hide", "window-maximize", "window-minimize", "window-show", "window-start-dragging", "window-unmaximize", "window-unminimize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
