[package]
name = "calabi-yau-lab"
version = "0.7.0"
description = "Calabi-Yau Lab: see what higher dimensions look like"
authors = ["Aaron Grace"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["window-close", "window-hide", "window-maximize", "window-minimize", "window-show", "window-start-dragging", "window-unmaximize", "window-unminimize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
base64 = "0.22"

[features]
custom-protocol = ["tauri/custom-protocol"]
