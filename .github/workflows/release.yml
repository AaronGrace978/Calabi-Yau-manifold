name: Release Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag version (e.g. v0.3.0)'
        required: false
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  release-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            os_label: linux-x86_64
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            os_label: macos-aarch64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            os_label: macos-x86_64
          - platform: windows-latest
            args: ''
            os_label: windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.3.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux system dependencies (GTK3 / WebKit2GTK / AppIndicator)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend production bundle
        run: npm run build

      - name: Build and publish Tauri desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: "Calabi-Yau AI Platform ${{ steps.meta.outputs.tag }}"
          releaseBody: |
            ## Calabi-Yau AI Platform ${{ steps.meta.outputs.tag }} — Live WebGL Build Launcher & Native Machine Harness Release

            Higher-dimensional **Calabi-Yau Quintic Threefold** ($\mathbb{CP}^4$) WebGL visualizer and borderless cyberpunk overlay featuring:
            - **Live WebGL Build Launcher & Sandbox Runner**: Automatically detects generated HTML / Three.js / GLSL shaders in model responses and runs them in a live sandboxed WebGL viewport or spawns a dedicated native OS window (`launch_artifact_window`).
            - **Native Rust Machine Filesystem Harness**: Saves generated projects and shaders directly to `~/CalabiYauProjects/` on your machine (`save_artifact_to_disk`, `list_saved_artifacts`) without requiring an external harness.
            - **Quantum Reasoning Trace Separation**: Separates internal chain-of-thought (`message.thinking` / `reasoning_content` from models like `deepseek-v4.1-flash`) into a collapsible reasoning drawer while keeping final output and executable code blocks clean.
            - **Direct 6D Manifold Directive Locking**: Prompts or shader directives specifying Euler's constant ($\xi = e \approx 2.71828\text{ rad}$), $0.500\text{ THz}$ Simplex burst envelopes, or Fermat degree $n$ immediately lock onto the main 3D Calabi-Yau viewport.
            - **19 Cloud & Local AI Providers**: **Ollama Cloud (`https://ollama.com/api/chat`)** plus **18 Frontier AI Providers** and their newest 2026 models.

            ### Supported Providers & 2026 Frontier Models
            - **Ollama Cloud (`ollama.com`)**: `deepseek-v4.1-flash`, `deepseek-v4-pro:0813`, `mistral-large-4`, `kimi-k3`, `kimi-k2.7-code`, `glm-5.3`, `glm-5.3-flash`, `qwen3.5:397b`, `gemma4:31b`, `minimax-m3`, `nemotron-3-ultra`, `gpt-oss:120b` + live `/api/tags` sync
            - **Anthropic**: `claude-opus-5-5`, `claude-sonnet-5-5`, `claude-haiku-5-5`, `claude-fable-5-1`, `claude-opus-5`
            - **OpenAI**: `gpt-6-astra`, `gpt-6.1-sol`, `gpt-6-sol`, `gpt-6-luna`, `gpt-5.6-sol`, `gpt-5.6-terra`, `gpt-5.5-pro`, `gpt-5.3-codex`
            - **Google DeepMind**: `gemini-4-argon`, `gemini-3.8-flash`, `gemini-3.7-flash`, `gemini-3.5-flash`, `gemini-3.1-pro`
            - **xAI**: `grok-4.7`, `grok-4.6`, `grok-4.5`, `grok-4.3-beta`
            - **DeepSeek**: `deepseek-v4.1-flash`, `deepseek-v4-pro-0813`, `deepseek-v4-pro`, `deepseek-reasoner`
            - **Meta AI**: `muse-wonder-full`, `muse-wonder-1.0`, `muse-spark-1.3`, `llama-4-maverick-17b-128e`
            - **Mistral AI**: `mistral-large-4`, `mistral-large-3-675b`, `devstral-2-123b`
            - **Alibaba Qwen**: `qwen-3.8-max`, `qwen-3.8-27b`, `qwen-3.7-max`
            - **Moonshot Kimi**: `kimi-k3`, `kimi-k2.7-code`, `kimi-k2.6`
            - **Z.ai / Zhipu**: `glm-5.3`, `glm-5.3-flash`, `glm-5.2`
            - **OpenRouter, Groq LPU, Together AI, Fireworks AI, Perplexity Sonar, Cerebras, NVIDIA NIM, & Ollama Local**

            ### Platform Installers & Bundles
            - **macOS (Apple Silicon M1/M2/M3/M4)**: `.dmg` & `.app.tar.gz` (`aarch64-apple-darwin`)
            - **macOS (Intel x86_64)**: `.dmg` & `.app.tar.gz` (`x86_64-apple-darwin`)
            - **Linux (x86_64)**: `.AppImage` & `.deb` (`ubuntu-22.04`)
            - **Windows (x86_64)**: `.msi` & `.exe` NSIS installer (`x86_64-pc-windows-msvc`)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
