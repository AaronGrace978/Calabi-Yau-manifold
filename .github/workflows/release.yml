name: Release Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag version (e.g. v0.8.0)'
        required: false
        default: 'v0.8.0'

permissions:
  contents: write

jobs:
  release-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            os_label: linux-x86_64
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            os_label: macos-aarch64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            os_label: macos-x86_64
          - platform: windows-latest
            args: ''
            os_label: windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.8.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux system dependencies (GTK3 / WebKit2GTK / AppIndicator)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run geometry unit tests
        run: npm test

      - name: Verify frontend production bundle
        run: npm run build

      - name: Run Rust unit tests
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and publish Tauri desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: "Calabi-Yau Lab ${{ steps.meta.outputs.tag }}"
          releaseBody: |
            ## Calabi-Yau Lab ${{ steps.meta.outputs.tag }}

            See and hear what higher dimensions look like. The geometry lab is now a Synesthesia Engine: vertex counts, hidden-axis depth, and slice motion drive a polyphonic synthesizer.

            - **Topological sonification**: an 8-voice Web Audio synth. Vertex count sets the fundamental, N-dimensional depth sets the overtones, and the slice slider sweeps a low-pass filter.
            - **Presets**: E8 Coxeter symphony, Calabi-Yau filter sweep, Clifford torus loop, 24-cell minor ninth, Kaluza-Klein momentum tower, and string harmonics.
            - **Rust 11D offload**: thread-safe Tauri commands rotate, project, and slice manifolds up to 11D, then stream Float32 buffers back to the viewer when the frame rate drops.
            - **Acoustic geometry guide**: the Ask panel receives live synth state and can play a preset with `PLAY_RESONANCE`.
            - **Dimension ladder, 2D to 11D**: hypercube, simplex and cross-polytope, with counted faces checked against the f-vector.
            - **4D regular polytopes**: 24-cell and 600-cell with exact cross-sections.
            - **Surfaces in 4D**: Clifford torus, Hopf fibration, Klein bottle.
            - **Calabi-Yau, E8, and the Kaluza-Klein garden hose**, plus 4D rotation, hidden-axis spin, perspective / orthographic / stereographic projection, exact slicing, and PNG snapshots.

            Installers: Windows (`.msi`, `.exe`), macOS Apple Silicon and Intel (`.dmg`), Linux (`.AppImage`, `.deb`, `.rpm`).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
