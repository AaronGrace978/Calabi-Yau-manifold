name: Release Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag version (e.g. v0.7.0)'
        required: false
        default: 'v0.7.0'

permissions:
  contents: write

jobs:
  release-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            os_label: linux-x86_64
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            os_label: macos-aarch64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            os_label: macos-x86_64
          - platform: windows-latest
            args: ''
            os_label: windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.7.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux system dependencies (GTK3 / WebKit2GTK / AppIndicator)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run geometry unit tests
        run: npm test

      - name: Verify frontend production bundle
        run: npm run build

      - name: Run Rust unit tests
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and publish Tauri desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: "Calabi-Yau Lab ${{ steps.meta.outputs.tag }}"
          releaseBody: |
            ## Calabi-Yau Lab ${{ steps.meta.outputs.tag }}

            See what higher dimensions look like. The app builder, command runner and token instrument are gone; the app is now a geometry lab.

            - **Dimension ladder, 2D to 11D**: hypercube, simplex and cross-polytope, with counted faces checked against the f-vector.
            - **4D regular polytopes**: 24-cell and 600-cell with exact cross-sections.
            - **Surfaces in 4D**: Clifford torus, Hopf fibration (linked circles), Klein bottle without self-intersection.
            - **Calabi-Yau**: the Fermat curve picture of a Calabi-Yau slice, degree 2 to 7.
            - **E8**: all 240 roots in the computed Coxeter-plane (Petrie) projection.
            - **Compact extra dimension**: the Kaluza-Klein garden hose.
            - 4D rotation sliders, spin through every hidden axis, perspective / orthographic / stereographic projection, exact slicing, PNG snapshots.
            - **Ask about this**: stream an explanation of the object on screen from any configured provider.

            Installers: Windows (`.msi`, `.exe`), macOS Apple Silicon and Intel (`.dmg`), Linux (`.AppImage`, `.deb`).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
