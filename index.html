<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calabi-Yau Lab</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="titlebar" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <span class="brand-mark">CY</span>
          <span class="brand-name" data-tauri-drag-region>CALABI-YAU LAB</span>
          <span class="brand-tag" data-tauri-drag-region>see what higher dimensions look like</span>
        </div>
        <div class="titlebar-actions">
          <button id="btn-synth" class="chip" type="button" title="Toggle the Synesthesia polyphonic synthesizer">SYNTH: OFF</button>
          <button id="btn-snapshot" class="chip" type="button" title="Save a PNG of the current view">SNAPSHOT</button>
          <button id="btn-toggle-notes" class="chip" type="button" title="Show or hide the field notes">NOTES</button>
          <div id="window-controls" class="window-controls hidden">
            <button id="win-min" class="win-btn" type="button" aria-label="Minimize">&#8211;</button>
            <button id="win-max" class="win-btn" type="button" aria-label="Maximize">&#9633;</button>
            <button id="win-close" class="win-btn close" type="button" aria-label="Close">&#10005;</button>
          </div>
        </div>
      </header>

      <main class="layout">
        <nav id="space-list" class="space-list" aria-label="Spaces"></nav>

        <section class="stage">
          <div id="viewport" class="viewport"></div>

          <div class="stage-badge">
            <span id="space-badge">—</span>
            <span id="slice-readout" class="muted"></span>
            <span id="synth-readout" class="muted"></span>
          </div>
          <div id="toast" class="toast hidden"></div>

          <div class="dock">
            <div id="param-controls" class="dock-group"></div>

            <div id="rotation-controls" class="dock-group">
              <div class="dock-title">4D ROTATION</div>
              <label class="ctl"><span>x ↔ w <em id="val-xw">0.00</em></span><input id="rot-xw" type="range" min="-3.1416" max="3.1416" step="0.01" value="0" /></label>
              <label class="ctl"><span>y ↔ w <em id="val-yw">0.00</em></span><input id="rot-yw" type="range" min="-3.1416" max="3.1416" step="0.01" value="0" /></label>
              <label class="ctl"><span>z ↔ w <em id="val-zw">0.00</em></span><input id="rot-zw" type="range" min="-3.1416" max="3.1416" step="0.01" value="0" /></label>
            </div>

            <div class="dock-group">
              <div class="dock-title">VIEW</div>
              <label class="ctl check"><input id="auto-spin" type="checkbox" /><span>Spin through hidden axes</span></label>
              <label class="ctl"><span>Spin speed <em id="val-speed">0.35</em></span><input id="spin-speed" type="range" min="0.05" max="1.5" step="0.05" value="0.35" /></label>
              <label class="ctl">
                <span>Projection</span>
                <select id="projection">
                  <option value="perspective">Perspective (a camera in each extra axis)</option>
                  <option value="orthographic">Orthographic (drop extra axes)</option>
                  <option value="stereographic">Stereographic (4D sphere → 3D)</option>
                </select>
              </label>
            </div>

            <div id="slice-controls" class="dock-group">
              <div class="dock-title">CROSS-SECTION</div>
              <label class="ctl check"><input id="slice-on" type="checkbox" /><span>Slice the hidden axis</span></label>
              <label class="ctl"><span>Slice at <em id="val-slice">0.00</em></span><input id="slice-level" type="range" min="-1.2" max="1.2" step="0.01" value="0" /></label>
              <label class="ctl check"><input id="slice-only" type="checkbox" /><span>Show only the slice</span></label>
            </div>

            <div id="synth-controls" class="dock-group">
              <div class="dock-title">SYNESTHESIA SYNTH</div>
              <label class="ctl check"><input id="synth-on" type="checkbox" /><span>Topological sonification</span></label>
              <label class="ctl">
                <span>Harmonic preset</span>
                <select id="synth-preset">
                  <option value="default">Auto (match manifold)</option>
                  <option value="string_harmonics">String Harmonics (KK / CY)</option>
                  <option value="e8_symphony">E₈ Coxeter Symphony</option>
                  <option value="calabi_yau">Calabi-Yau Filter Sweep</option>
                  <option value="clifford_torus">Clifford Torus Loop</option>
                  <option value="minor_chord">24-Cell Minor Ninth</option>
                  <option value="major_chord">Polytope Just Major</option>
                  <option value="kaluza_klein">Kaluza-Klein Momentum</option>
                </select>
              </label>
              <label class="ctl"><span>Gain <em id="val-synth-vol">0.35</em></span><input id="synth-volume" type="range" min="0" max="1" step="0.01" value="0.35" /></label>
            </div>
          </div>
        </section>

        <aside id="notes" class="notes">
          <h1 id="notes-title">—</h1>
          <p id="notes-dim" class="muted"></p>

          <h2>What you are seeing</h2>
          <p id="notes-what"></p>
          <h2>How it is drawn</h2>
          <p id="notes-how"></p>
          <h2>Try this</h2>
          <ul id="notes-try"></ul>
          <h2>Facts</h2>
          <dl id="notes-facts" class="facts"></dl>

          <section class="ask">
            <div class="ask-head">
              <h2>Ask about this</h2>
              <button id="btn-ask-settings" class="link" type="button">MODEL</button>
            </div>
            <div id="ask-settings" class="ask-settings hidden">
              <label class="ctl"><span>Provider</span><select id="ask-provider"></select></label>
              <label class="ctl"><span>Model</span><select id="ask-model"></select></label>
              <label class="ctl"><span>Custom model (optional)</span><input id="ask-custom-model" type="text" placeholder="e.g. gemma4:31b" /></label>
              <label class="ctl"><span>API key</span><input id="ask-key" type="password" autocomplete="off" placeholder="Leave blank to use the provider's environment variable" /></label>
              <label class="ctl"><span>Endpoint override</span><input id="ask-endpoint" type="text" /></label>
              <button id="btn-sync-models" class="link" type="button">FETCH LIVE MODEL LIST</button>
            </div>
            <div id="ask-log" class="ask-log"></div>
            <form id="ask-form" class="ask-form">
              <textarea id="ask-input" rows="2" placeholder="Why does the tesseract seem to turn inside out?"></textarea>
              <button id="ask-send" type="submit" class="chip accent">ASK</button>
            </form>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
